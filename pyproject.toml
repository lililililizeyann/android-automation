[project]
name = "android-automation"
version = "0.1.0"
description = "ADB-based Android UI automation practice"
requires-python = ">=3.14"
dependencies = [
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["android_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
